site_name: Tyler's Homelab
site_description: Network engineering and security homelab documentation

theme:
  name: material
  features:
    - content.code.copy      # adds a "copy" button to code blocks
  palette:
    scheme: slate
    primary: blue grey
    accent: orange      

markdown_extensions:
  - admonition               # !!! note / !!! warning callout boxes
  - pymdownx.highlight       # syntax highlighting in code blocks
  - pymdownx.superfences     # better fenced code blocks

nav:
  - Home: index.md
  - Network: network.md
